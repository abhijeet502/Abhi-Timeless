<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timeless ⏳ | By Abhi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1 class="title">⏳ Timeless</h1>
    <p class="subtitle">A Living Day & Night Experience</p>
  </header>

  <main>
    <div class="sky" id="sky">
      <div class="sun" id="sun"></div>
      <div class="moon" id="moon"></div>
      <div class="stars" id="stars"></div>
      <div class="clouds" id="clouds"></div>
    </div>

    <section class="content">
      <h2>Welcome to Abhi’s Timeless World</h2>
      <p>
        This site changes as time passes — just like life. Watch the colors flow, 
        stars appear, and light fade as the day turns to night. 
      </p>
      <div id="clock" class="clock"></div>
    </section>
  </main>

  <footer>
    <p>Crafted with ❤️ by Abhi</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
